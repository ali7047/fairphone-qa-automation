name: Smoke tests

# The pre-deploy gate candidate: the 4 customer journeys on the real shop.
#
#   Lint ─────┐
#             ├──> Smoke journeys (gate) ──┐
#   Unit ─────┘                            ├──> Allure report
#             └──> Known issues (may fail) ┘
#
# - Lint and Unit tests run in parallel and need no browser (about a minute).
# - Smoke and Known issues start only when BOTH have passed: no point opening
#   browsers on the live shop when the code itself is broken.
# - "Smoke journeys" is the gate: it must be green.
# - "Known issues" runs checks that fail today because of a known shop gap;
#   it is allowed to be red and never blocks a pull request.
# - Both browser jobs upload raw results; "Allure report" turns them into one
#   report (every step, screenshot and data; trace and video for failures).

on:
  pull_request:
  workflow_dispatch:
    inputs:
      region:
        description: "Shop"
        type: choice
        options: [eu, us]
        default: eu
      language:
        description: "Language (eu: en or nl; us: en)"
        type: choice
        options: [en, nl]
        default: en
      base_url:
        description: "Address to test (empty = the region's live shop; set an acceptance address here)"
        type: string
        default: ""
      browser:
        description: "Browser"
        type: choice
        options: [chromium, firefox, webkit]
        default: chromium

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  REGION: ${{ inputs.region || 'eu' }}
  SHOP_LANGUAGE: ${{ inputs.language || 'en' }}
  BASE_URL: ${{ inputs.base_url }}
  BROWSER: ${{ inputs.browser || 'chromium' }}

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint (likely bugs, unused code, import order)
        run: uv run python -m ruff check . --output-format=github
      - name: Formatting
        run: uv run python -m ruff format --check --diff .

  unit:
    name: Unit tests (config, test data, helpers)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python -m pytest tests/unit -p no:cacheprovider

  smoke:
    name: Smoke journeys (gate)
    needs: [lint, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-playwright
        with:
          browser: ${{ env.BROWSER }}
      - name: Run smoke journeys
        # At most 2 parallel workers on the live shop. One retry: a test that
        # passes on retry is reported as flaky, not hidden.
        run: >
          uv run python -m pytest -m smoke
          --browser "$BROWSER" -n 2 --reruns 1
          --junitxml=test-results/junit.xml
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-smoke
          path: allure-results
          retention-days: 14
      - name: Upload traces and videos of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-smoke
          path: test-results
          retention-days: 14

  known-issues:
    name: Known issues (allowed to fail)
    needs: [lint, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-playwright
        with:
          browser: ${{ env.BROWSER }}
      - name: Run known-issue checks
        run: uv run python -m pytest -m known_issue --browser "$BROWSER"
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-known-issues
          path: allure-results
          retention-days: 14
      - name: Upload traces and videos of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-known-issues
          path: test-results
          retention-days: 14

  report:
    name: Allure report
    needs: [smoke, known-issues]
    # Build the report whenever the browser jobs ran (pass or fail),
    # but not when Lint or Unit failed and the browser jobs were skipped.
    if: ${{ always() && (needs.smoke.result == 'success' || needs.smoke.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The environment's URL is shown as a clickable link on this job's box in the
    # run graph and on the pull request ("View deployment"): one click to the report.
    environment:
      name: allure-report
      url: ${{ steps.publish.outputs.url }}
    permissions:
      contents: write     # push the report to the gh-pages branch
      pages: write        # start a GitHub Pages build
      deployments: write  # show the report link on the job box and the pull request
    env:
      WORKFLOW_NAME: ${{ github.workflow }}
      RUN_NUMBER: ${{ github.run_number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      BRANCH: ${{ github.head_ref || github.ref_name }}
      COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/smoke/${{ github.run_number }}/
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true
      - name: Add run details to the report (executor, environment)
        run: python3 .github/scripts/report_site.py metadata allure-results
      - name: Bring back history (trends across runs)
        # Allure draws pass/fail trends when the previous run's history is present.
        # The publish step keeps a copy of it at <site>/smoke/latest/history/.
        continue-on-error: true
        run: |
          mkdir -p allure-results/history
          for f in history.json history-trend.json duration-trend.json categories-trend.json retry-trend.json; do
            curl -fsSL "$PAGES_URL/smoke/latest/history/$f" -o "allure-results/history/$f" || rm -f "allure-results/history/$f"
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build the report
        run: npx --yes allure-commandline@2 generate allure-results --clean -o allure-report
      - name: Upload the report (artifact, kept 14 days)
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 14
      - name: Publish the report to GitHub Pages
        id: publish
        continue-on-error: true
        env:
          REMOTE_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: bash .github/scripts/publish_report.sh allure-report smoke "$RUN_NUMBER"
      - name: Turn on GitHub Pages (first run only)
        if: steps.publish.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            gh api -X POST "repos/${{ github.repository }}/pages" \
              -f "source[branch]=gh-pages" -f "source[path]=/" >/dev/null \
              && echo "GitHub Pages turned on (gh-pages branch)."
          fi
      - name: Wait until the report is online
        id: live
        if: steps.publish.outcome == 'success'
        continue-on-error: true
        run: |
          for i in $(seq 1 24); do
            if curl -fsS -o /dev/null "$REPORT_URL"; then echo "live=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 10
          done
          echo "live=false" >> "$GITHUB_OUTPUT"
      - name: Summary on the run page (with the report link)
        if: always()
        env:
          PUBLISHED: ${{ steps.publish.outcome == 'success' }}
          REPORT_LIVE: ${{ steps.live.outputs.live }}
        run: |
          python3 .github/scripts/report_site.py summary allure-results >> "$GITHUB_STEP_SUMMARY"
          if [ "$PUBLISHED" = "true" ]; then
            echo "::notice title=Allure report::$REPORT_URL"
          fi
